<section id="download">
  <div class="container">
    <div class="cta-poster rv">
      <div class="glow"></div>
      <h2>{{ module.heading_line1 }} <span class="accent">{{ module.heading_accent }}</span><br>{{ module.heading_line2 }}</h2>
      <div class="cta-body">{{ module.body_text }}</div>
      <div class="ctas">
        <a class="btn btn-primary" href="{{ module.primary_cta_url.href }}">{{ module.primary_cta_label }} <span class="arrow">→</span></a>
        <a class="btn btn-ghost" href="{{ module.secondary_cta_url.href }}">{{ module.secondary_cta_label }}</a>
      </div>
      <div class="small">{{ module.footer_note }}</div>
    </div>
  </div>
</section>
